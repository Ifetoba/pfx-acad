{% extends 'base.html' %}

{% block title %} SignIn {% endblock %}

{% block content %}
<div class="container my-5 text-sm-center">
    <h2 class="">Login</h2>
    <div class="my-2">
        <form action="" method="post" class="">
            {% csrf_token %}
            <div class="container-md">
                {% for field in form %}
                <div class="form-label">
                    {{ field.label_tag }}
                </div>
                <div class="form-control">
                    {{ field }}
                </div>
                <div class="text-danger">
                    {{ field.errors }}
                </div>
                {% endfor %}
            </div>
            <div class="my-2">
                <button type="submit" class="btn btn-success">SignIn</button>
            </div>
        </form>
    </div>
    <div class="">
        <p>Not Registered Yet?<span class="px-2"><a href="{% url 'users:signup' %}">Register Now</a></span></p>
    </div>
</div>
{% endblock %}
