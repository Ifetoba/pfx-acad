{% extends 'base.html' %}

{% block title %} SignIn {% endblock %}

{% block content %}
    <div class="container my-5">
        <h2 class="text-sm-center">Login</h2>
        <form action="" method="post" class="mx-sm-auto text-sm-center">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">SignIn</button>
        </form>
    </div>
{% endblock %}
