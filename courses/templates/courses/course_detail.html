{% extends 'base.html' %}

{% block title %} Courses Detail {% endblock %}

{% block content %}
<h2>{{ course.title }}</h2>
<p>{{ course.description }}</p>
<p>Level: {{ course.level }}</p>
<p>Price: {% if course.is_free %}Free{% else %}£{{ course.price }}{% endif %}</p>
<a href="{% url 'courses:enroll-course' course.id %}">Enroll Now</a>
{% endblock %}
